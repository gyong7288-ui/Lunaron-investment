<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNARON — Investment Dashboard v3.5</title>
<script src="/lib/react.min.js"></script>
<script src="/lib/react-dom.min.js"></script>
<script src="/lib/prop-types.min.js"></script>
<script src="/lib/recharts.min.js"></script>
<script src="/lib/babel.min.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    console.log('LUNARON v3.5 Loaded');
  });
</script>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Helvetica Neue', 'Hiragino Sans', 'Meiryo', Arial, sans-serif;
  background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
  color: #0B1F3A;
  min-height: 100vh;
}
button { cursor: pointer; font-family: inherit; }
input, select { font-family: inherit; }

/* ── Layout ── */
.app-wrapper { width: 100%; max-width: 100%; margin: 0 auto; padding: 0 0 40px; }

/* ── Header ── */
.header {
  background: #fff;
  border-bottom: 1px solid #E4E9F0;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-logo {
  width: 30px; height: 30px; background: #0B1F3A; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
}
.header-logo-dot { width: 13px; height: 13px; border-radius: 50%; background: #60A5FA; }
.header-title { font-size: 15px; font-weight: 700; letter-spacing: 2.5px; color: #0B1F3A; }
.header-sub { font-size: 10px; color: #94A3B8; letter-spacing: .5px; }
.live-badge { display: flex; align-items: center; gap: 5px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22C55E;
  animation: livepulse 2s infinite; }
@keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.live-text { font-size: 11px; color: #22C55E; font-weight: 600; letter-spacing: .5px; }

/* ── Tabs ── */
.tabs {
  background: #fff; border-bottom: 1px solid #E4E9F0;
  display: flex; padding: 0 24px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab-btn {
  padding: 12px 18px; border: none; background: none;
  font-size: 13px; font-weight: 500; color: #94A3B8;
  border-bottom: 2px solid transparent; cursor: pointer;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab-btn:hover { color: #475569; }
.tab-btn.active { color: #0B1F3A; border-bottom-color: #0B1F3A; }
.tab-btn.chat-highlight { color: #7C3AED; font-weight: 700; }
.tab-btn.chat-highlight.active { border-bottom-color: #7C3AED; }

/* ── Content ── */
.content { padding: 18px 20px; }

/* ── Cards ── */
.card {
  background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255,255,255,0.8);
  border-radius: 16px; padding: 18px 24px;
  box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
.metric-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 14px; padding: 16px 18px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.03);
  backdrop-filter: blur(8px);
  transition: transform 0.2s, box-shadow 0.2s;
}
.metric-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
.metric-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #64748B; margin-bottom: 6px; display: flex; align-items: center; }
.metric-value { font-size: 20px; font-weight: 600; letter-spacing: -.5px; color: #0F172A; }
.metric-sub { font-size: 11px; margin-top: 4px; color: #64748B; }

/* ── Buttons ── */
.primary-btn {
  background: #0B1F3A; color: #fff; border: none;
  padding: 10px 20px; border-radius: 8px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  width: 100%; transition: opacity .18s;
}
.primary-btn:hover { opacity: .85; }
.primary-btn:disabled { opacity: .45; cursor: not-allowed; }

/* ── AI result box ── */
.ai-box {
  background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: 10px; padding: 14px 16px;
  font-size: 13px; line-height: 1.8; color: #334155;
  white-space: pre-wrap; min-height: 110px;
}

/* ── Form inputs ── */
.inp {
  border: 1px solid #E2E8F0; border-radius: 8px;
  padding: 8px 12px; font-size: 13px; background: #fff;
  width: 100%; outline: none; color: #0B1F3A;
  transition: border-color .15s;
}
.inp:focus { border-color: #94A3B8; }

/* ── Footer ── */
.footer {
  margin-top: 20px; padding: 12px 0;
  border-top: 1px solid #E4E9F0;
  display: flex; justify-content: space-between;
  font-size: 10px; color: #CBD5E1;
}

/* ── Signal badge ── */
.signal-badge {
  display: inline-flex; align-items: center;
  padding: 4px 13px; border-radius: 20px;
  font-size: 12px; font-weight: 700; letter-spacing: .4px;
}
.s-buy  { background: #DCFCE7; color: #15803D; }
.s-sell { background: #FEE2E2; color: #DC2626; }
.s-hold { background: #FEF9C3; color: #B45309; }

/* ── Portfolio table ── */
.pf-table { width: 100%; border-collapse: collapse; }
.pf-table th { font-size: 10px; font-weight: 600; color: #94A3B8; padding: 10px; text-align: left; border-bottom: 1px solid #F1F5F9; }
.pf-table td { padding: 10px; border-bottom: 1px solid #F8FAFC; }

.pos { color: #16A34A; }
.neg { color: #DC2626; }

.help-tip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: 50%; background: #E2E8F0;
  color: #64748B; font-size: 9px; font-weight: 700; margin-left: 6px;
  cursor: help; position: relative;
}
.help-tip:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: #0B1F3A; color: #fff; padding: 8px 12px; border-radius: 6px;
  font-size: 11px; white-space: pre-wrap; width: max-content; max-width: 240px;
  z-index: 1000; margin-bottom: 6px; line-height: 1.4;
}

.ticker-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.ticker-btn {
  border: 1px solid #E2E8F0; background: #fff;
  padding: 5px 13px; border-radius: 20px;
  font-size: 12px; font-weight: 500; color: #64748B;
  transition: all .18s;
}
.ticker-btn.active { background: #0B1F3A; color: #fff; border-color: #0B1F3A; }

.divider { border: none; border-top: 1px solid #F1F5F9; margin: 14px 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const RechartsLib = window.Recharts || window.recharts;
const {
  LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer,
  ReferenceLine, CartesianGrid, ComposedChart, Bar, BarChart,
  AreaChart, Area, PieChart, Pie, Cell
} = RechartsLib || {};

const HF_BACKEND = "https://gyongery-lunaron-investment.hf.space";
const IS_LOCAL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
const API_BASE = (IS_LOCAL ? "http://localhost:8000" : HF_BACKEND);

const FALLBACK_TICKERS = [
  { id: "GLD",  name: "金 (ゴールド)", col: "#F59E0B", base: 210, seed: 101 },
  { id: "QQQ",  name: "テクノロジー (QQQ)", col: "#3B82F6", base: 440, seed: 102 },
  { id: "SQQQ", name: "逆回転 (ベア)", col: "#EF4444", base: 12,  seed: 103 },
  { id: "TQQQ", name: "米国10倍 (ブル)", col: "#10B981", base: 60,  seed: 104 },
  { id: "VOO",  name: "スタンダード (S&P500)", col: "#6366F1", base: 470, seed: 105 },
];

function App() {
  const [tab, setTab] = useState("chart");
  const [tick, setTick] = useState(FALLBACK_TICKERS[0]);
  const [backendOk, setBackendOk] = useState(false);
  const [chatHistory, setChatHistory] = useState([
    { role: "assistant", content: "こんにちは！投資アドバイザーのLunaron AIです。投資の悩みやNISAの活用方法など、何でも聞いてください。" }
  ]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);

  useEffect(() => {
    fetch(`${API_BASE}/api/health`)
      .then(r => { if(r.ok) setBackendOk(true); })
      .catch(() => setBackendOk(false));
  }, []);

  const runChat = async () => {
    if (!chatInput.trim() || chatLoading) return;
    const userMsg = chatInput.trim();
    setChatInput("");
    setChatLoading(true);
    setChatHistory(prev => [...prev, { role: "user", content: userMsg }]);

    try {
      const r = await fetch(`${API_BASE}/api/chat`, {
        method: "POST", headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ message: userMsg, history: chatHistory })
      });
      const data = await r.json();
      setChatHistory(prev => [...prev, { role: "assistant", content: data.response }]);
    } catch (e) {
      setChatHistory(prev => [...prev, { role: "assistant", content: "AIサーバーに接続できませんでした。しばらく経ってから再度お試しください。" }]);
    }
    setChatLoading(false);
  };

  return (
    <div className="app-wrapper">
      <header className="header">
        <div className="header-brand">
          <div className="header-logo"><div className="header-logo-dot"/></div>
          <div>
            <div className="header-title">LUNARON</div>
            <div className="header-sub">Investment Dashboard v3.5 (LATEST)</div>
          </div>
        </div>
        <div className="live-badge">
          <div className="live-dot"/><span className="live-text">{backendOk?"API ONLINE":"OFFLINE"}</span>
        </div>
      </header>

      <nav className="tabs">
        <button className={`tab-btn ${tab==="chart"?"active":""}`} onClick={()=>setTab("chart")}>◈ チャート分析</button>
        <button className={`tab-btn chat-highlight ${tab==="chat"?"active":""}`} onClick={()=>setTab("chat")}>✨ AI投資相談</button>
        <button className={`tab-btn ${tab==="portfolio"?"active":""}`} onClick={()=>setTab("portfolio")}>◉ ポートフォリオ</button>
      </nav>

      <div className="content">
        {tab === "chart" && (
          <div className="card">
            <div className="ticker-row">
              {FALLBACK_TICKERS.map(t => (
                <button key={t.id} className={`ticker-btn ${tick.id===t.id?"active":""}`} onClick={()=>setTick(t)}>{t.id}</button>
              ))}
            </div>
            <h2>{tick.name} の分析</h2>
            <div className="ai-box" style={{marginTop:20}}>
              チャートデータに基づいた分析を生成するにはAIサーバーが必要です。
            </div>
            
            <div style={{marginTop:20, padding:15, background:"#F1F5F9", borderRadius:10}}>
              <div style={{fontSize:12, fontWeight:700, marginBottom:8}}>✨ AIアドバイザーに質問する</div>
              <div style={{display:"flex", gap:10}}>
                <input className="inp" value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>e.key==="Enter" && runChat()} placeholder="この銘柄の今後の展望は？" />
                <button className="primary-btn" style={{width:"auto"}} onClick={runChat}>質問</button>
              </div>
            </div>
          </div>
        )}

        {tab === "chat" && (
          <div className="card" style={{height:"calc(100vh - 250px)", display:"flex", flexDirection:"column"}}>
            <div style={{flex:1, overflowY:"auto", padding:10, display:"flex", flexDirection:"column", gap:10}}>
              {chatHistory.map((msg, i) => (
                <div key={i} style={{
                  alignSelf: msg.role === "user" ? "flex-end" : "flex-start",
                  background: msg.role === "user" ? "#0B1F3A" : "#F1F5F9",
                  color: msg.role === "user" ? "#fff" : "#0B1F3A",
                  padding: "10px 15px", borderRadius: 12, maxWidth: "80%", fontSize: 13
                }}>
                  {msg.content}
                </div>
              ))}
              {chatLoading && <div style={{fontSize:12, color:"#94A3B8"}}>AIが考え中...</div>}
            </div>
            <div style={{display:"flex", gap:10, borderTop:"1px solid #E2E8F0", paddingTop:15}}>
              <input className="inp" value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>e.key==="Enter" && runChat()} placeholder="投資について何でも相談してください" />
              <button className="primary-btn" style={{width:"auto"}} onClick={runChat}>送信</button>
            </div>
          </div>
        )}

        {tab === "portfolio" && (
          <div className="card">
            <h2>マイポートフォリオ</h2>
            <p style={{marginTop:10, color:"#64748B"}}>現在、ポートフォリオ機能は準備中です。AIチャットで資産配分の相談ができます。</p>
          </div>
        )}
      </div>

      <footer className="footer" style={{padding:"20px", textAlign:"center", borderTop:"1px solid #E4E9F0", marginTop:20}}>
        <div style={{fontSize:12, color:"#64748B"}}>© 2026 LUNARON v3.5 (AI Chat Implementation)</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
