<script>
// Safe access to Recharts global
const RechartsLib = window.Recharts || window.recharts;

// Basic error logging to UI with more details
window.onerror = function(msg, url, line, col, error) {
  const root = document.getElementById('root');
  if (root) {
    root.innerHTML = `<div style="padding:20px;color:#ef4444;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:20px;font-family:sans-serif;">
      <h3 style="margin-top:0">Dashboard Error</h3>
      <p style="font-size:14px"><strong>Message:</strong> ${msg}</p>
      <p style="font-size:12px"><strong>Location:</strong> ${url} (${line}:${col})</p>
      ${error ? `<pre style="font-size:11px;background:#fee2e2;padding:8px;overflow:auto">${error.stack}</pre>` : ''}
      <div style="margin-top:10px;font-size:12px;color:#64748b;">
        Debug: React=${typeof React}, ReactDOM=${typeof ReactDOM}, PropTypes=${typeof window.PropTypes}, Recharts=${typeof RechartsLib}
      </div>
      <button onclick="location.reload()" style="margin-top:15px;padding:8px 16px;background:#ef4444;color:#fff;border:none;border-radius:4px;cursor:pointer;">再読み込み</button>
    </div>`;
  }
  return false;
};

if (!RechartsLib || typeof RechartsLib.LineChart === 'undefined') {
  console.warn("Recharts library incomplete or failed to load. Using fallback components.");
}
</script>

<script type="text/babel">

const { useState, useEffect, useCallback } = React;
const {
  LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer,
  ReferenceLine, CartesianGrid, ComposedChart, Bar, BarChart,
  AreaChart, Area, PieChart, Pie, Cell
} = RechartsLib || {};

/* ════════════════════════════════════════════════════════
   CONFIG — バックエンドURL（相対パスを使用）
   ════════════════════════════════════════════════════════ */
const API_BASE = window.location.origin;

/* ── Ticker 定義（バックエンドが落ちている場合のフォールバック用） ── */
const FALLBACK_TICKERS = [
  { id: "GLD",  name: "金 (ゴールド)", col: "#F59E0B", base: 210, seed: 101 },
  { id: "QQQ",  name: "テクノロジー (QQQ)", col: "#3B82F6", base: 440, seed: 102 },
  { id: "SQQQ", name: "逆回転 (ベア)", col: "#EF4444", base: 12,  seed: 103 },
  { id: "TQQQ", name: "米国10倍 (ブル)", col: "#10B981", base: 60,  seed: 104 },
  { id: "VOO",  name: "スタンダード (S&P500)", col: "#6366F1", base: 470, seed: 105 },
];
const TICKER_MAP = Object.fromEntries(FALLBACK_TICKERS.map(t => [t.id, t]));
const PIE_COLORS = ["#1D4ED8","#7C3AED","#F59E0B","#10B981","#EF4444","#6366F1","#B45309","#8B5CF6"];

/* ── フォールバック: ブラウザ内でインジケーター計算 ── */
function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0x100000000; };
}
function calcEMAjs(arr, n) {
  const k = 2 / (n + 1); const out = [arr[0]];
  for (let i = 1; i < arr.length; i++) out.push(arr[i] * k + out[i-1] * (1-k));
  return out;
}
function calcRSIjs(arr, n=14) {
  const chg = arr.slice(1).map((v,i)=>v-arr[i]);
  const out = new Array(n).fill(null);
  let ag = chg.slice(0,n).filter(c=>c>0).reduce((a,b)=>a+b,0)/n;
  let al = chg.slice(0,n).filter(c=>c<0).reduce((a,b)=>a-b,0)/n;
  for (let i=n; i<chg.length; i++) {
    const g=Math.max(chg[i],0), l=Math.max(-chg[i],0);
    ag=(ag*(n-1)+g)/n; al=(al*(n-1)+l)/n;
    out.push(al===0?100:100-100/(1+ag/al));
  }
  return out;
}
function calcMACDjs(arr) {
  const e12=calcEMAjs(arr,12), e26=calcEMAjs(arr,26);
  const line=arr.map((_,i)=>e12[i]-e26[i]);
  const sig=calcEMAjs(line,9);
  return { line, sig, hist:line.map((m,i)=>m-sig[i]) };
}
function calcBBjs(arr, n=20) {
  const up=[],mid=[],lo=[];
  for (let i=0; i<arr.length; i++) {
    if (i<n-1){up.push(null);mid.push(null);lo.push(null);continue;}
    const sl=arr.slice(i-n+1,i+1);
    const m=sl.reduce((a,b)=>a+b,0)/n;
    const sd=Math.sqrt(sl.reduce((a,b)=>a+(b-m)**2,0)/n);
    up.push(m+2*sd); mid.push(m); lo.push(m-2*sd);
  }
  return { up, mid, lo };
}
function calcSharpeJs(prices, rf=0.045) {
  const ret = prices.slice(1).map((v,i)=>(v-prices[i])/prices[i]);
  const ar = ret.reduce((a,b)=>a+b,0)/ret.length*252;
  const av = Math.sqrt(ret.reduce((a,b)=>a+(b-ar/252)**2,0)/ret.length)*Math.sqrt(252);
  return av===0 ? 0 : (ar-rf)/av;
}
function gbmJs(prices, simCount=300, days=7) {
  const lr = prices.slice(1).map((v,i)=>Math.log(v/prices[i]));
  const mu = lr.reduce((a,b)=>a+b,0)/lr.length;
  const variance = lr.reduce((a,b)=>a+(b-mu)**2,0)/lr.length;
  const sigma = Math.sqrt(variance);
  const S0 = prices[prices.length-1]; const dt = 1/252;
  const r = seededRand(42);
  const paths = [];
  for (let s=0; s<simCount; s++) {
    let p=S0; const path=[p];
    for (let d=0; d<days; d++) {
      const z=(r()+r()+r()+r()+r()+r()-3)*Math.sqrt(2);
      p = p*Math.exp((mu-0.5*variance)*dt+sigma*Math.sqrt(dt)*z);
      path.push(p);
    }
    paths.push(path);
  }
  const result=[];
  for (let d=0; d<=days; d++) {
    const vals=paths.map(p=>p[d]).sort((a,b)=>a-b);
    const n=vals.length;
    result.push({
      day: d===0?"現在":`+${d}日`,
      p10:vals[Math.floor(n*.10)], p25:vals[Math.floor(n*.25)],
      p50:vals[Math.floor(n*.50)], p75:vals[Math.floor(n*.75)],
      p90:vals[Math.floor(n*.90)],
    });
  }
  return { forecast:result, annual_volatility:sigma*Math.sqrt(252), annual_drift:mu*252 };
}
function genFallbackData(base, seed, days=120) {
  const r=seededRand(seed || 42); const d=[]; let p=base || 200;
  for (let i=0; i<days; i++) {
    const dt=new Date(); dt.setDate(dt.getDate()-(days-i));
    p=Math.max(p+(r()-0.478)*base*0.022, base*0.6);
    d.push({ date:`${dt.getMonth()+1}/${dt.getDate()}`, close:p });
  }
  return d;
}
function buildChartData(ticker) {
  const raw = genFallbackData(ticker.base, ticker.seed);
  const closes = raw.map(d=>d.close);
  const rsiArr = calcRSIjs(closes);
  const {line:ml, sig:ms, hist:mh} = calcMACDjs(closes);
  const {up,mid,lo} = calcBBjs(closes);
  const sharpe = calcSharpeJs(closes);
  const gbm = gbmJs(closes);
  const chartData = raw.map((d,i)=>({
    date:d.date, close:+d.close.toFixed(2),
    rsi:rsiArr[i]!=null?+rsiArr[i].toFixed(1):null,
    macd:+ml[i].toFixed(4), macdSig:+ms[i].toFixed(4), hist:+mh[i].toFixed(4),
    upper:up[i]!=null?+up[i].toFixed(2):null,
    middle:mid[i]!=null?+mid[i].toFixed(2):null,
    lower:lo[i]!=null?+lo[i].toFixed(2):null,
  }));
  const latest=chartData[chartData.length-1];
  const prev=chartData[chartData.length-2];
  let chg = 0;
  if (latest && prev && prev.close !== 0) {
    chg = ((latest.close - prev.close) / prev.close * 100).toFixed(2);
  }
  let score=0;
  const rv=latest.rsi;
  if(rv<30)score+=2; else if(rv<45)score+=1; else if(rv>70)score-=2; else if(rv>60)score-=1;
  if(latest.hist>0)score+=1; else score-=1;
  if(latest.close<(latest.lower||0)*1.02)score+=1;
  if(latest.close>(latest.upper||0)*0.98)score-=1;
  const signal = score>=2?"BUY":score<=-2?"SELL":"HOLD";
  return { chartData, latest, change_pct:+chg, sharpe:+sharpe.toFixed(3), signal, gbm, color:ticker.col };
}

/* ── Format helpers ── */
function fmtPrice(v, tickerId) {
  if (v == null || isNaN(v)) return "---";
  if (tickerId==="BTC"||tickerId==="ETH") return "$"+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  if (v>10000) return "$"+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return "$"+v.toFixed(2);
}
function fmtYen(v) { return "¥"+Math.round(v).toLocaleString(); }

/* ════════════════════════════════════════════════════════
   メインコンポーネント
   ════════════════════════════════════════════════════════ */
function App() {
  const [tab, setTab] = useState("chart");
  const [tickers, setTickers] = useState(FALLBACK_TICKERS);
  const [tick, setTick] = useState(FALLBACK_TICKERS[0]);
  const [backendOk, setBackendOk] = useState(false);
  const [chartSub, setChartSub] = useState("RSI");
  const [indicatorData, setIndicatorData] = useState(null);
  const [indicatorLoading, setIndicatorLoading] = useState(false);
  const [analysis, setAnalysis] = useState("");
  const [analysisLoading, setAnalysisLoading] = useState(false);
  const [signal, setSignal] = useState(null);
  const [pfAnalysis, setPfAnalysis] = useState("");
  const [pfLoading, setPfLoading] = useState(false);
  const [apiError, setApiError] = useState("");
  const [holdings, setHoldings] = useState([]);
  const [newTicker, setNewTicker] = useState("GLD");
  const [newQty, setNewQty] = useState("");
  const [newBuy, setNewBuy] = useState("");
  const [newCat, setNewCat] = useState("PayPay");
  const [aiQuery, setAiQuery] = useState("");

  const [isSimpleMode, setIsSimpleMode] = useState(true);
  const [yenInvested, setYenInvested] = useState("");
  const [yenCurrent, setYenCurrent] = useState("");
  const [ollamaStatus, setOllamaStatus] = useState({ ollama_running: false, gemma3_ready: false, message: "確認中..." });

  /* バックエンド疎通確認 */
  useEffect(() => {
    const checkStatus = async () => {
      try {
        const r = await fetch(`${API_BASE}/api/health`);
        if (r.ok) {
          const data = await r.json();
          setBackendOk(true);
          if (data.usdjpy) setUsdjpy(data.usdjpy);
          fetchTickers();
          // AIの状態も確認
          const ar = await fetch(`${API_BASE}/api/ollama/status`);
          const ad = await ar.json();
          setOllamaStatus(ad);
        } else {
          setBackendOk(false);
        }
      } catch {
        setBackendOk(false);
      }
    };
    checkStatus();
    const timer = setInterval(checkStatus, 30000); // 30秒ごとに更新
    return () => clearInterval(timer);
  }, []);

  const fetchTickers = async () => {
    try {
      const r = await fetch(`${API_BASE}/api/tickers`);
      const data = await r.json();
      if (data.tickers) setTickers(data.tickers);
    } catch {}
  };

  /* インジケーターデータ取得 */
  const fetchIndicators = useCallback(async (t) => {
    setIndicatorLoading(true); setApiError("");
    if (backendOk) {
      try {
        const r = await fetch(`${API_BASE}/api/indicators/${t.id}`);
        if (!r.ok) throw new Error(await r.text());
        const data = await r.json();
        setIndicatorData(data);
        setIndicatorLoading(false);
        return;
      } catch (e) { setApiError("バックエンドエラー。フォールバックデータを使用中。"); }
    }
    // フォールバック
    setIndicatorData(buildChartData(t));
    setIndicatorLoading(false);
  }, [backendOk]);

  useEffect(() => {
    fetchIndicators(tick);
    setAnalysis(""); setSignal(null);
  }, [tick]);

  /* AI分析実行 */
  const runAnalysis = async () => {
    setAnalysisLoading(true); setAnalysis(""); setApiError("");
    if (backendOk) {
      try {
        const r = await fetch(`${API_BASE}/api/analyze`, {
          method: "POST", headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ ticker_id: tick.id, query: aiQuery })
        });
        const data = await r.json();
        if (data.analysis) {
          setSignal(data.signal); 
          setAnalysis(data.analysis);
          setAnalysisLoading(false); 
          setAiQuery(""); 
          return;
        }
      } catch (e) { console.error(e); }
    }
    const msg = ollamaStatus.ollama_running 
      ? (ollamaStatus.gemma3_ready ? "AI分析に失敗しました。時間をおいて再度お試しください。" : "AIモデル(Gemma3)を準備中です。`ollama pull gemma3` を実行してください。")
      : "AI(Ollama)が起動していません。ターミナルで `ollama serve` を実行してください。";
    setAnalysis(msg);
    setAnalysisLoading(false);
  };

  /* ポートフォリオ診断 */
  const runPfAnalysis = async () => {
    if (!holdings.length) return;
    setPfLoading(true); setPfAnalysis(""); setApiError("");
    const payload = holdings.map(h=>({
      ticker:h.ticker, name:h.name,
      qty:parseFloat(h.qty)||0,
      buy_price:parseFloat(h.buyPrice)||0,
    }));
    if (backendOk) {
      try {
        const r = await fetch(`${API_BASE}/api/portfolio/analyze`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ holdings: payload })
        });
        const data = await r.json();
        if (data.analysis) {
          setPfAnalysis(data.analysis); 
          setPfLoading(false); 
          return;
        }
      } catch { }
    }
    const msg = ollamaStatus.ollama_running 
      ? "ポートフォリオ分析に失敗しました。AIモデルが準備できているか確認してください。"
      : "AI(Ollama)が起動していません。`ollama serve` を実行してください。";
    setPfAnalysis(msg);
    setPfLoading(false);
  };

  const addHolding = () => {
    const t = TICKER_MAP[newTicker];
    if (!t) return;
    
    let qty, buyPrice;
    
    if (isSimpleMode) {
      // かんたん入力モード (円単位)
      if (!yenInvested) return;
      const invYen = parseFloat(yenInvested);
      const curYen = parseFloat(yenCurrent) || invYen;
      
      // バックエンドから取得した現在のドル価格 (デモの場合はbuildChartDataから取得)
      const currentPriceUSD = (indicatorData && indicatorData.ticker_id === newTicker) 
        ? indicatorData.latest.close 
        : buildChartData(t).latest.close;
        
      // 数量 = 現在の評価額(円) / (現在の株価(ドル) * ドル円)
      qty = curYen / (currentPriceUSD * usdjpy);
      // 取得単価 = 投資額(円) / (数量 * ドル円)
      buyPrice = invYen / (qty * usdjpy);
    } else {
      // 通常入力モード
      if (!newQty || !newBuy) return;
      qty = parseFloat(newQty);
      buyPrice = parseFloat(newBuy);
    }

    setHoldings(h => [...h, { 
      id:Date.now(), 
      ticker:newTicker, 
      name:t.name, 
      qty:qty, 
      buyPrice:buyPrice,
      cat:newCat 
    }]);
    setNewQty(""); setNewBuy(""); setYenInvested(""); setYenCurrent("");
  };
  const removeHolding = id => setHoldings(h => h.filter(x => x.id !== id));

  /* ポートフォリオ計算 */
  const pfData = holdings.map(h => {
    const t = TICKER_MAP[h.ticker];
    if (!t) return { ...h, currentPrice:+h.buyPrice, pnl:0, pnlPct:0, currentVal:0, totalCost:0, col:"#94A3B8" };
    const raw = genFallbackData(t.base, t.seed);
    const cur = raw[raw.length-1].close;
    const qty = parseFloat(h.qty)||0, buy = parseFloat(h.buyPrice)||cur;
    const totalCost = qty*buy, currentVal = qty*cur;
    const pnl = currentVal-totalCost, pnlPct = totalCost>0?(pnl/totalCost)*100:0;
    return { ...h, currentPrice:cur, pnl, pnlPct, currentVal, totalCost, col:t.col };
  });
  const totalCost = pfData.reduce((a,b)=>a+b.totalCost,0);
  const totalVal  = pfData.reduce((a,b)=>a+b.currentVal,0);
  const totalPnl  = totalVal - totalCost;
  const totalPnlPct = totalCost>0?(totalPnl/totalCost)*100:0;

  /* Chart helpers */
  const d = indicatorData;
  const recent = (d && d.chartData) ? d.chartData.slice(-30) : [];
  const latest = d ? d.latest : null;
  const gbm = d ? d.gbm : null;
  const priceMin = recent.length ? Math.min(...recent.map(x=>(x.lower||x.close)))*0.997 : 0;
  const priceMax = recent.length ? Math.max(...recent.map(x=>(x.upper||x.close)))*1.003 : 100;

  const CustomTT = ({ active, payload, label }) => {
    if (!active || !payload?.length) return null;
    return (
      <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:8,padding:"8px 12px",fontSize:11}}>

        {payload.map((p,i) => p.value != null && (
          <div key={i} style={{color:p.color||"#0B1F3A",fontWeight:500}}>

          </div>
        ))}
      </div>

            <div style={{display:"flex",gap:12,marginTop:2}}>

            </div>
          </div>
          <div className="live-badge">
            <div className="live-dot"/><span className="live-text">LIVE</span>
          </div>
        </div>
      </header>

      {/* ── Tabs ── */}
      <nav className="tabs">
        {[["chart","◈ チャート分析"],["portfolio","◉ ポートフォリオ"],["forecast","◎ GBM予測"]].map(([k,l])=>(

      <div className="content">

                </div>
                <div style={{fontSize:16,fontWeight:700,color:"#0B1F3A"}}>{indicatorData?.expert?.fg_val || 50}</div>

                <div style={{fontSize:16,fontWeight:700,color:"#0B1F3A"}}>

                  {indicatorData?.expert?.tip || "航路を守りましょう。"}

            </div>

            {/* AI備考欄 */}
            <div style={{marginTop:12,paddingTop:10,borderTop:"1px dashed #E2E8F0"}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <div style={{fontSize:9,background:"#0B1F3A",color:"#fff",padding:"2px 6px",borderRadius:4,fontWeight:700}}>AI備考</div>

          {/* Metric cards */}
          <div className="metric-grid" style={{gridTemplateColumns:"repeat(5,1fr)"}}>

              ["価格", latest?fmtPrice(latest.close,tick.id):"—",

                      <XAxis dataKey="date" tick={{fontSize:8,fill:"#94A3B8"}} tickLine={false} axisLine={false} interval={5}/>

              {/* Trend Gauge */}
              {signal && (
                <div style={{margin:"8px 0"}}>
                  <div style={{display:"flex", justifyContent:"space-between", fontSize:10, color:"#64748B", fontWeight:600, marginBottom:4}}>
                    <span>弱気 (SELL)</span>
                    <span>中立 (HOLD)</span>
                    <span>強気 (BUY)</span>
                  </div>
                  <div style={{height:10, background:"linear-gradient(90deg, #EF4444 0%, #F59E0B 50%, #10B981 100%)", borderRadius:10, position:"relative"}}>
                    <div style={{
                      position:"absolute", top:-3, width:16, height:16, borderRadius:"50%", background:"#fff", border:"3px solid #0F172A",
                      left: signal==="BUY" ? "85%" : signal==="SELL" ? "15%" : "50%", transform:"translateX(-50%)", transition:"left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)",
                      boxShadow:"0 2px 4px rgba(0,0,0,0.2)"
                    }}></div>
                  </div>
                </div>
              )}

              <div className="ai-box" style={{flex:1, padding: analysis ? "0" : "12px", background: analysis ? "transparent" : "#F8FAFC", border: analysis ? "none" : "1px solid #E2E8F0"}}>
                {analysisLoading
                  ? <div className="thinking"><div className="thinking-dot"/><div className="thinking-dot"/><div className="thinking-dot"/><span className="thinking-text">分析中...</span></div>
                  : analysis
                    ? (
                        <div style={{display:"flex", flexDirection:"column", gap:8}}>
                          {analysis.split("### ").filter(b => b.trim()).map((block, i) => {
                            if (!block.includes("【")) return <span key={i}>{block}</span>;
                            const parts = block.split('\n');
                            const title = parts[0].trim();
                            const content = parts.slice(1).join('\n').trim();
                            let icon = "💬", color = "#1D4ED8", bg = "#EFF6FF";
                            if (title.includes("結論")) { icon = "🎯"; color = "#16A34A"; bg = "#DCFCE7"; }
                            else if (title.includes("根拠")) { icon = "📊"; color = "#0B1F3A"; bg = "#F1F5F9"; }
                            else if (title.includes("リスク")) { icon = "⚠️"; color = "#DC2626"; bg = "#FEE2E2"; }
                            
                            return (
                              <div key={i} style={{padding:"10px 12px", background:bg, borderRadius:8, borderLeft:`3px solid ${color}`}}>
                                <div style={{fontWeight:600, fontSize:12, color:color, marginBottom:4, display:"flex", alignItems:"center", gap:6}}>
                                  <span>{icon}</span> {title}
                                </div>
                                <div style={{fontSize:11, color:"#334155", whiteSpace:"pre-wrap", lineHeight:1.5}}>{content}</div>
                              </div>
                            );
                          })}
                        </div>
                      )
                    : <span className="ai-placeholder">
                        指標に基づいた分析を行います。個別の質問がある場合は下に入力してください。
                      </span>
                }
              </div>
              <textarea className="inp" style={{minHeight:60,fontSize:12,resize:"vertical"}}
                placeholder="例: この銘柄の売り時はいつ？ 10倍になる可能性はある？"
                value={aiQuery} onChange={e=>setAiQuery(e.target.value)}
                disabled={analysisLoading}/>
              <button className="primary-btn" onClick={runAnalysis} disabled={analysisLoading}>
                {analysisLoading ? "分析中..." : "◆ AI分析を実行"}
              </button>

              {/* Quant summary */}
              <hr className="divider"/>
              <div className="metric-label">定量指標サマリー</div>
                {[
                  ["RSI値",     latest?.rsi?.toFixed(1)??"—", latest?.rsi>70?"#DC2626":latest?.rsi<30?"#16A34A":"#0F172A", "買われすぎ・売られすぎを示す指標です。70以上は過熱（売りサイン）、30以下は売られすぎ（買いサイン）とされます。"],
                  ["MACD方向",  latest?.hist>0?"強気 ↗":"弱気 ↘", latest?.hist>0?"#16A34A":"#DC2626", "トレンドの方向性を示す指標です。「強気」は上昇トレンド、「弱気」は下落トレンドを示唆します。"],
                  ["前日比",    d?`${d.change_pct>=0?"+":""}${d.change_pct}%`:"—", d?.change_pct>=0?"#16A34A":"#DC2626", "直近の終値と1日前の終値の変動率です。"],
                  ["シャープ比", d?.sharpe?.toFixed(2)??"—", d?.sharpe>1?"#16A34A":d?.sharpe<0?"#DC2626":"#0F172A", "投資の「効率の良さ」を示します。1.0以上なら優秀、マイナスはリスクに見合っていない状態です。"],
                ].map(([k,v,c,tip])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                    <span style={{color:"#64748B", display:"flex", alignItems:"center"}}>
                      {k}
                      <span className="help-tip" data-tip={tip}>?</span>
                    </span>
                    <span style={{fontWeight:600,color:c}}>{v}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </>}

        {/* ══════════════════════════════════════════
            TAB: ポートフォリオ
            ══════════════════════════════════════════ */}
        {tab==="portfolio" && <>
          {/* Summary cards */}
          <div className="metric-grid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
            {[
              ["投資総額", fmtYen(totalCost), null],
              ["現在総額", fmtYen(totalVal),
               <span className={totalPnlPct>=0?"pos":"neg"} style={{fontSize:11}}>
                 {totalPnlPct>=0?"▲":"▼"}{Math.abs(totalPnlPct).toFixed(1)}%
               </span>],
              ["含み損益",
               <span className={totalPnl>=0?"pos":"neg"} style={{fontSize:18,fontWeight:600}}>
                 {totalPnl>=0?"+":""}{fmtYen(totalPnl)}
               </span>, null],
            ].map(([l,v,s],i)=>(
              <div key={i} className="metric-card">
                <div className="metric-label">{l}</div>
                <div style={{fontSize:18,fontWeight:600,marginTop:2}}>{v}</div>
                {s&&<div style={{marginTop:4}}>{s}</div>}
              </div>
            ))}
          </div>

          {/* Asset Allocation Pie Chart */}
          {pfData.length > 0 && (
            <div className="card" style={{marginBottom:15, display:"flex", alignItems:"center", gap:20}}>
              <div style={{flex:1}}>
                <div className="metric-label" style={{marginBottom:10}}>アセットアロケーション (配分比率)</div>
                <ResponsiveContainer width="100%" height={180}>
                  <PieChart>
                    <Pie
                      data={pfData}
                      dataKey="currentVal"
                      nameKey="name"
                      cx="50%"
                      cy="50%"
                      innerRadius={50}
                      outerRadius={70}
                      paddingAngle={2}
                    >
                      {pfData.map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={PIE_COLORS[index % PIE_COLORS.length]} />
                      ))}
                    </Pie>
                    <Tooltip formatter={(val, name) => [fmtYen(val), name]} contentStyle={{fontSize:11, borderRadius:8, border:"none", boxShadow:"0 4px 6px -1px rgba(0,0,0,0.1)"}}/>
                  </PieChart>
                </ResponsiveContainer>
              </div>
              <div style={{flex:1, display:"flex", flexDirection:"column", gap:8}}>
                {pfData.slice().sort((a,b)=>b.currentVal - a.currentVal).map((h, i) => (
                  <div key={h.id} style={{display:"flex", alignItems:"center", justifyContent:"space-between", fontSize:11}}>
                    <div style={{display:"flex", alignItems:"center", gap:6}}>
                      <div style={{width:8, height:8, borderRadius:"50%", background:PIE_COLORS[pfData.indexOf(h) % PIE_COLORS.length]}}></div>
                      <span style={{fontWeight:500}}>{h.name}</span>
                    </div>
                    <div>
                      <span style={{fontWeight:600}}>{((h.currentVal / totalVal) * 100).toFixed(1)}%</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Holdings Sections */}
          {["PayPay", "NISA"].map(section => {
            const sectionData = pfData.filter(h => (section==="PayPay" ? h.cat==="PayPay" : h.cat==="NISA"));
            const sectionCost = sectionData.reduce((a,b)=>a+b.totalCost,0);
            const sectionVal  = sectionData.reduce((a,b)=>a+b.currentVal,0);
            const sectionPnl  = sectionVal - sectionCost;
            const sectionPnlPct = sectionCost>0 ? (sectionPnl/sectionCost*100) : 0;

            return (
              <div key={section} className="card" style={{marginBottom:15, borderLeft:`4px solid ${section==="PayPay"?"#0B1F3A":"#8B5CF6"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontSize:14,fontWeight:600,color:section==="PayPay"?"#0B1F3A":"#8B5CF6"}}>
                    {section==="PayPay" ? "◆ PayPay ポイント運用枠" : "● NISA / 証券口座枠"}
                  </div>
                  <div style={{fontSize:12,fontWeight:600}}>
                    小計: {fmtYen(sectionVal)} 
                    <span style={{marginLeft:8,color:sectionPnl>=0?"#16A34A":"#DC2626"}}>
                      ({sectionPnl>=0?"+":""}{sectionPnlPct.toFixed(1)}%)
                    </span>
                  </div>
                </div>

                {sectionData.length===0 ? (
                  <div style={{textAlign:"center",padding:"16px 0",color:"#CBD5E1",fontSize:12}}>銘柄がありません</div>
                ) : (
                  <table className="pf-table">
                    <thead>
                      <tr>
                        <th>銘柄</th>
                        <th>数量</th>
                        <th>取得単価</th>
                        <th>評価額</th>
                        <th>損益</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      {sectionData.map(h=>(
                        <tr key={h.id}>
                          <td>
                            <div className="ticker-name" style={{color:h.col}}>{h.ticker}</div>
                            <div className="ticker-sub">{h.name}</div>
                          </td>
                          <td style={{fontSize:13}}>{parseFloat(h.qty).toLocaleString()}</td>
                          <td style={{fontSize:12}}>${parseFloat(h.buyPrice).toFixed(0)}</td>
                          <td style={{fontSize:12,fontWeight:500}}>{fmtYen(h.currentVal)}</td>
                          <td>
                            <div style={{fontSize:12,fontWeight:600,color:h.pnl>=0?"#16A34A":"#DC2626"}}>
                              {h.pnl>=0?"+":""}{fmtYen(h.pnl)}
                            </div>
                          </td>
                          <td><button className="remove-btn" onClick={()=>removeHolding(h.id)}>✕</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            );
          })}

          {/* Add holding form */}
          <div className="card" style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div className="metric-label">銘柄を追加</div>
              <div style={{display:"flex",gap:4,background:"#F1F5F9",padding:2,borderRadius:6}}>
                <button onClick={()=>setIsSimpleMode(true)} 
                  style={{fontSize:10,padding:"4px 10px",borderRadius:4,border:"none",cursor:"pointer",
                    background:isSimpleMode?"#fff":"transparent", boxShadow:isSimpleMode?"0 1px 2px rgba(0,0,0,0.1)":"none"}}>
                  円で入力 (かんたん)
                </button>
                <button onClick={()=>setIsSimpleMode(false)}
                  style={{fontSize:10,padding:"4px 10px",borderRadius:4,border:"none",cursor:"pointer",
                    background:!isSimpleMode?"#fff":"transparent", boxShadow:!isSimpleMode?"0 1px 2px rgba(0,0,0,0.1)":"none"}}>
                  数量で入力 (詳細)
                </button>
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"120px 160px 1fr 1fr 1fr",gap:10,alignItems:"end"}} className="two-col">
              <div>
                <label className="form-label">運用枠</label>
                <div style={{display:"flex",gap:4}}>
                  {["PayPay", "NISA"].map(c=>(
                    <button key={c} onClick={()=>setNewCat(c)}
                      style={{
                        flex:1, padding:"6px 0", borderRadius:6, fontSize:10, border:"1px solid #E2E8F0",
                        background:newCat===c?"#0B1F3A":"#fff", color:newCat===c?"#fff":"#64748B",
                        cursor:"pointer"
                      }}>
                      {c}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <label className="form-label">銘柄</label>
                <select className="sel" value={newTicker} onChange={e=>setNewTicker(e.target.value)}>
                  {tickers.map(t=><option key={t.id} value={t.id}>{t.id} — {t.name}</option>)}
                </select>
              </div>

              {isSimpleMode ? (
                <>
                  <div>
                    <label className="form-label">投資したポイント・金額 (円)</label>
                    <input className="inp" type="number" placeholder="例: 10000" 
                      value={yenInvested} onChange={e=>setYenInvested(e.target.value)}/>
                  </div>
                  <div>
                    <label className="form-label">今の評価額 (円)</label>
                    <input className="inp" type="number" placeholder="省略可" 
                      value={yenCurrent} onChange={e=>setYenCurrent(e.target.value)}/>
                  </div>
                </>
              ) : (
                <>
                  <div>
                    <label className="form-label">保有数量</label>
                    <input className="inp" type="number" step="any" placeholder="例: 1.5" 
                      value={newQty} onChange={e=>setNewQty(e.target.value)}/>
                  </div>
                  <div>
                    <label className="form-label">取得単価 ($USD)</label>
                    <input className="inp" type="number" step="any" placeholder="例: 490.0" 
                      value={newBuy} onChange={e=>setNewBuy(e.target.value)}/>
                  </div>
                </>
              )}

              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                <button onClick={addHolding} disabled={isSimpleMode ? !yenInvested : (!newQty||!newBuy)}
                  style={{background:"#0B1F3A",color:"#fff",border:"none",padding:"9px 10px",
                    borderRadius:8,fontSize:13,fontWeight:500,opacity:(isSimpleMode?!yenInvested:(!newQty||!newBuy))?0.4:1}}>
                  ＋ 追加
                </button>
                {isSimpleMode && <div style={{fontSize:9,color:"#94A3B8",textAlign:"center"}}>レート: 1$ = {usdjpy}円</div>}
              </div>
            </div>
          </div>

          {/* Portfolio AI analysis */}
          <div className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div>
                <div style={{fontSize:13,fontWeight:600}}>Lunaron AI — ポートフォリオ診断</div>
                <div style={{fontSize:10,color:"#94A3B8",marginTop:2}}>
                  全保有銘柄を分析 → 継続保有・利益確定・損切りの判断と次のアクションを提案します
                </div>
              </div>
            </div>
            <div className="ai-box" style={{minHeight:130,marginBottom:12}}>
              {pfLoading
                ? <div className="thinking"><div className="thinking-dot"/><div className="thinking-dot"/><div className="thinking-dot"/><span className="thinking-text">ポートフォリオを分析中...</span></div>
                : pfAnalysis
                  ? <span>{pfAnalysis}</span>
                  : <span className="ai-placeholder">「ポートフォリオ診断」を実行すると、各銘柄の判断と全体のリスク評価を提案します。</span>
              }
            </div>
            <button className="primary-btn" onClick={runPfAnalysis} disabled={pfLoading||pfData.length===0}>
              {pfLoading ? "診断中..." : "◉ ポートフォリオ診断を実行"}
            </button>
          </div>
        </>}

        {/* ══════════════════════════════════════════
            TAB: GBM予測
            ══════════════════════════════════════════ */}
        {tab==="forecast" && <>
        {/* Category Filter */}
      <div style={{display:"flex",gap:8,padding:"0 4px",marginBottom:8}}>
        {["すべて", "PayPay", "NISA"].map(c=>(
          <button key={c} onClick={()=>setFilterCat(c)}
            style={{
              padding:"4px 12px", borderRadius:20, fontSize:10, border:"1px solid #E2E8F0",
              background:filterCat===c?"#0B1F3A":"#fff", color:filterCat===c?"#fff":"#64748B",
              cursor:"pointer", transition:"all 0.2s"
            }}>
            {c}
          </button>
        ))}
      </div>

      <div className="ticker-row" style={{marginBottom:15,padding:"0 4px",display:"flex",overflowX:"auto",gap:6}}>
        {tickers
          .filter(t => filterCat==="すべて" || (t.cat && t.cat.includes(filterCat)))
          .map(t=>(
          <button key={t.id} className={`ticker-btn ${tick.id===t.id?"active":""}`} onClick={()=>setTick(t)}
            style={{flex:"0 0 100px",padding:"10px 5px",fontSize:11}}>
            <strong>{t.id}</strong><br/>
            <span style={{opacity:.8,fontSize:9,display:"block",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.name}</span>
          </button>
        ))}
      </div>

          {gbm && <>
            <div className="metric-grid" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
              {[
                ["現在価格", fmtPrice(latest.close,tick.id), "基準"],
                ["7日後 中央値", fmtPrice(gbm.forecast[gbm.forecast.length-1].p50,tick.id), "50パーセンタイル"],
                ["楽観シナリオ",  fmtPrice(gbm.forecast[gbm.forecast.length-1].p90,tick.id), "90パーセンタイル"],
                ["悲観シナリオ",  fmtPrice(gbm.forecast[gbm.forecast.length-1].p10,tick.id), "10パーセンタイル"],
              ].map(([l,v,s])=>(
                <div key={l} className="metric-card">
                  <div className="metric-label">{l}</div>
                  <div style={{fontSize:16,fontWeight:600,marginTop:2}}>{v}</div>
                  <div style={{fontSize:10,color:"#94A3B8",marginTop:2}}>{s}</div>
                </div>
              ))}
            </div>

            <div className="chart-panel">
              <div className="chart-title">幾何ブラウン運動（GBM）7日間価格予測</div>
              <div className="chart-sub">
                数式: dS = μS dt + σS dW&nbsp;&nbsp;|&nbsp;&nbsp;
                年率ボラ: {(gbm.annual_volatility*100).toFixed(1)}%&nbsp;&nbsp;
                年率期待収益: {(gbm.annual_drift*100).toFixed(1)}%
              </div>
              <ResponsiveContainer width="100%" height={220}>
                <ComposedChart data={gbm.forecast} margin={{top:4,right:8,bottom:0,left:0}}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#F1F5F9" vertical={false}/>
                  <XAxis dataKey="day" tick={{fontSize:10,fill:"#94A3B8"}} tickLine={false} axisLine={false}/>
                  <YAxis tick={{fontSize:9,fill:"#94A3B8"}} tickLine={false} axisLine={false} width={56}
                    tickFormatter={v=>tick.id==="BTC"||tick.id==="ETH"?"$"+(v/1000).toFixed(0)+"k":"$"+v.toFixed(0)}
                    domain={[d=>d*0.995, d=>d*1.005]}/>
                  <Tooltip content={<CustomTT/>}/>
                  <Area dataKey="p90" stroke="none" fill="#DBEAFE" fillOpacity={0.7} name="90%ile"/>
                  <Area dataKey="p10" stroke="none" fill="#fff"    fillOpacity={1}   name="10%ile"/>
                  <Area dataKey="p75" stroke="none" fill="#BFDBFE" fillOpacity={0.6} name="75%ile"/>
                  <Area dataKey="p25" stroke="none" fill="#fff"    fillOpacity={1}   name="25%ile"/>
                  <Line type="monotone" dataKey="p90" stroke="#93C5FD" strokeWidth={1} dot={false} strokeDasharray="4 2" name="90%"/>
                  <Line type="monotone" dataKey="p75" stroke="#60A5FA" strokeWidth={1} dot={false} strokeDasharray="3 2" name="75%"/>
                  <Line type="monotone" dataKey="p50" stroke={col} strokeWidth={2.5}
                    dot={{r:4,fill:col,stroke:"#fff",strokeWidth:2}} name="中央値"/>
                  <Line type="monotone" dataKey="p25" stroke="#60A5FA" strokeWidth={1} dot={false} strokeDasharray="3 2" name="25%"/>
                  <Line type="monotone" dataKey="p10" stroke="#93C5FD" strokeWidth={1} dot={false} strokeDasharray="4 2" name="10%"/>
                </ComposedChart>
              </ResponsiveContainer>
              <div className="legend-row">
                <span><span className="legend-dot" style={{background:col}}/>中央値 (50%)</span>
                <span><span className="legend-dot" style={{background:"#60A5FA"}}/>25–75% レンジ</span>
                <span><span className="legend-dot" style={{background:"#93C5FD"}}/>10–90% レンジ</span>
              </div>
            </div>

            <div className="card">
              <div style={{fontSize:12,fontWeight:600,marginBottom:10}}>GBMモデルの解説</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}} className="two-col">
                <div className="formula-box">
                  <strong>数式の各パラメータ</strong><br/>
                  dS = μS dt + σS dW<br/>
                  ・ S : 株価<br/>
                  ・ μ (ドリフト) : 期待収益率 = {(gbm.annual_drift*100).toFixed(1)}% / 年<br/>
                  ・ σ (ボラティリティ) : 変動率 = {(gbm.annual_volatility*100).toFixed(1)}% / 年<br/>
                  ・ dW : ブラウン運動（ランダムウォーク）
                </div>
                <div className="formula-box">
                  <strong>グラフの読み方</strong><br/>
                  ・ 帯の幅 → 価格の不確実性の大きさ<br/>
                  ・ 中央値が右上がり → 上昇バイアス<br/>
                  ・ 悲観10%ile → これを下回る確率10%<br/>
                  ・ 楽観90%ile → これを上回る確率10%<br/>
                  ※ 過去データに基づく統計的推定です
                </div>
              </div>
            </div>
          </>}
        </>}

        {/* Footer */}
        <div className="footer">
          <span>LUNARON Investment Dashboard v2.0 · {backendOk?"リアルデータ使用":"シミュレーションデータ使用"}</span>
          <span>投資は自己責任でお願いします · Not financial advice</span>
        </div>
      </div>
      {/* ── Footer ── */}
      <footer style={{marginTop:40,padding:24,borderTop:"1px solid #E2E8F0",textAlign:"center"}}>
        <div style={{fontSize:10,color:"#94A3B8"}}>
          &copy; 2026 Lunaron AI Investment Dashboard. すべてのデータは分析用であり、投資判断は自己責任で行ってください。
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
